<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TGG Admin</title>
<style>
  :root {
    --div: #7C3AED; --cines: #0EA5E9; --dep: #14B8A6; --comida: #22C55E;
    --hotel: #4ADE80; --fiestas: #F97316; --conciertos: #C2410C; --teatro: #DC2626;
    --bg: #0F1115; --card: #1A1D24; --text: #F5F5F7; --muted: #9CA3AF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 20px 16px 60px; max-width: 560px; margin: 0 auto;
  }
  h1 { font-size: 19px; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 22px; }

  .card { background: var(--card); border: 1px solid #2A2E37; border-radius: 16px; padding: 18px; margin-bottom: 18px; }
  label { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted); margin-bottom: 5px; margin-top: 12px; }
  label:first-child { margin-top: 0; }
  input, select, textarea {
    width: 100%; background: #12141a; border: 1px solid #2A2E37; border-radius: 10px;
    padding: 10px 12px; color: var(--text); font-size: 14px; outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: #7C3AED; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .chk-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
  .chk-opt { display: flex; align-items: center; gap: 5px; font-size: 12.5px; background: #12141a; border: 1px solid #2A2E37; padding: 6px 10px; border-radius: 8px; cursor: pointer; }
  .chk-opt input { width: auto; }

  button {
    border: none; border-radius: 10px; font-weight: 700; font-size: 13.5px; cursor: pointer; padding: 11px 16px;
  }
  .btn-primary { background: linear-gradient(135deg, #7C3AED, #DC2626); color: white; width: 100%; margin-top: 16px; }
  .btn-danger { background: #DC262622; color: #FCA5A5; border: 1px solid #DC262655; }
  .btn-editar { background: #7C3AED22; color: #C4B5FD; border: 1px solid #7C3AED55; }
  .neg-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .neg-actions button { padding: 7px 12px; font-size: 12px; }
  .btn-logout { background: var(--card); color: var(--muted); border: 1px solid #2A2E37; }

  #login-view { max-width: 340px; margin: 60px auto 0; }
  .error-msg { color: #FCA5A5; font-size: 12.5px; margin-top: 10px; display: none; }
  .ok-msg { color: #86EFAC; font-size: 12.5px; margin-top: 10px; display: none; }

  header.topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }

  .neg-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #22252c; gap: 10px; }
  .neg-item:last-child { border-bottom: none; }
  .neg-name { font-size: 13.5px; font-weight: 600; }
  .neg-cat { font-size: 11px; color: var(--muted); }
  #admin-view { display: none; }
</style>
</head>
<body>

<div id="load-error" style="display:none; background:#DC2626; color:white; padding:12px 14px; border-radius:10px; margin-bottom:16px; font-size:13px; max-width:340px; margin-left:auto; margin-right:auto;"></div>

<div id="login-view">
  <h1>🔐 TGG Admin</h1>
  <div class="sub">Acceso solo para administradores</div>
  <div class="card">
    <label>Correo</label>
    <input type="email" id="login-email" placeholder="admin@tuguiaguate.com">
    <label>Contraseña</label>
    <input type="password" id="login-pass" placeholder="••••••••">
    <button class="btn-primary" id="btn-login">Entrar</button>
    <div class="error-msg" id="login-error"></div>
    <div class="sub" style="margin-top:16px; margin-bottom:0;">¿Primera vez? <a href="#" id="link-signup" style="color:#3B82F6;">Crear cuenta admin</a></div>
  </div>
</div>

<div id="admin-view">
  <header class="topbar">
    <div>
      <h1>Panel de negocios</h1>
      <div class="sub" id="user-email"></div>
    </div>
    <button class="btn-logout" id="btn-logout">Salir</button>
  </header>

  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
      <div style="font-weight:700; font-size:14px;" id="form-titulo">➕ Agregar negocio</div>
      <a href="#" id="link-cancelar-edicion" style="display:none; color:#F87171; font-size:12px; font-weight:600;">Cancelar edición</a>
    </div>
    <label>Nombre</label>
    <input type="text" id="f-nombre" placeholder="Ej: Café La Esquina">

    <label>Categoría</label>
    <select id="f-categoria">
      <option value="Diversión">Diversión</option>
      <option value="Cines">Cines</option>
      <option value="Deportes">Deportes</option>
      <option value="Comida y bebida" selected>Comida y bebida</option>
      <option value="Hotel y Spa">Hotel y Spa</option>
      <option value="Fiestas">Fiestas</option>
      <option value="Conciertos">Conciertos</option>
      <option value="Teatro">Teatro</option>
    </select>

    <div class="row2">
      <div>
        <label>Emoji</label>
        <input type="text" id="f-emoji" placeholder="🍽️" maxlength="4">
      </div>
      <div>
        <label>Zona (0 = fuera de ciudad)</label>
        <input type="number" id="f-zona" placeholder="10">
      </div>
    </div>

    <div class="row2">
      <div>
        <label>Precio (1-4)</label>
        <input type="number" id="f-precio" min="1" max="4" value="2">
      </div>
      <div>
        <label>Duración</label>
        <input type="text" id="f-duracion" placeholder="2h">
      </div>
    </div>

    <label>Texto corto (meta)</label>
    <input type="text" id="f-meta" placeholder="Zona 10 · $$ · 4.7★">

    <label>Link de Waze (opcional)</label>
    <input type="text" id="f-waze" placeholder="https://waze.com/ul/...">

    <label>Link de imagen (opcional)</label>
    <input type="text" id="f-imagen" placeholder="https://... (foto del lugar)">

    <label>Descripción / reseña breve (opcional)</label>
    <textarea id="f-descripcion" rows="3" placeholder="Un par de líneas contando qué lo hace especial..."></textarea>

    <label>Compañía recomendada</label>
    <div class="chk-row">
      <label class="chk-opt"><input type="checkbox" value="pareja"> Pareja</label>
      <label class="chk-opt"><input type="checkbox" value="amigos"> Amigos</label>
      <label class="chk-opt"><input type="checkbox" value="familia"> Familia</label>
      <label class="chk-opt"><input type="checkbox" value="solo"> Solo/a</label>
    </div>

    <label class="chk-opt" style="margin-top:14px; display:inline-flex;">
      <input type="checkbox" id="f-patrocinado"> Marcar como patrocinado
    </label>

    <button class="btn-primary" id="btn-guardar">Guardar negocio</button>
    <div class="error-msg" id="form-error"></div>
    <div class="ok-msg" id="form-ok">Negocio guardado ✅</div>
  </div>

  <div class="card">
    <div style="font-weight:700; font-size:14px; margin-bottom:8px;">📋 Negocios existentes</div>
    <div id="lista-negocios">Cargando...</div>
  </div>
</div>

<div style="text-align:center; color:#4B5563; font-size:11px; margin-top:24px;">build: v3-diagnostico</div>

<script>
  const SUPABASE_URL = "https://ecdgpjarhxigxuooqsal.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVjZGdwamFyaHhpZ3h1b29xc2FsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzOTA0NDIsImV4cCI6MjEwMzk2NjQ0Mn0.wn05ET7DasdJ5r3W3x_31sBPCq7KbKURWmPkEGSqP4Q";

  function mostrarErrorCarga(msg) {
    const banner = document.getElementById("load-error");
    banner.textContent = "⚠️ " + msg;
    banner.style.display = "block";
  }

  function guardarSesion(token, refreshToken, email) {
    localStorage.setItem("tgg_admin_token", token);
    localStorage.setItem("tgg_admin_refresh", refreshToken);
    localStorage.setItem("tgg_admin_email", email);
  }
  function borrarSesion() {
    localStorage.removeItem("tgg_admin_token");
    localStorage.removeItem("tgg_admin_refresh");
    localStorage.removeItem("tgg_admin_email");
  }

  async function refrescarToken() {
    const refreshToken = localStorage.getItem("tgg_admin_refresh");
    if (!refreshToken) return false;
    try {
      const res = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=refresh_token", {
        method: "POST",
        headers: { "apikey": SUPABASE_ANON_KEY, "Content-Type": "application/json" },
        body: JSON.stringify({ refresh_token: refreshToken })
      });
      const data = await res.json();
      if (!res.ok) return false;
      guardarSesion(data.access_token, data.refresh_token, data.user.email);
      return true;
    } catch (e) {
      return false;
    }
  }

  // Hace un fetch autenticado; si el token venció (401 / PGRST303 / JWT expired),
  // intenta renovarlo una vez y reintenta la petición automáticamente.
  async function fetchAutenticado(url, options) {
    options.headers["Authorization"] = "Bearer " + localStorage.getItem("tgg_admin_token");
    let res = await fetch(url, options);
    if (res.status === 401 || res.status === 403) {
      const renovado = await refrescarToken();
      if (renovado) {
        options.headers["Authorization"] = "Bearer " + localStorage.getItem("tgg_admin_token");
        res = await fetch(url, options);
      } else {
        borrarSesion();
        checkSesion();
        alert("Tu sesión expiró y no se pudo renovar. Volvé a entrar, por favor.");
      }
    }
    return res;
  }

  function mostrarAdmin(email) {
    document.getElementById("login-view").style.display = "none";
    document.getElementById("admin-view").style.display = "block";
    document.getElementById("user-email").textContent = email;
    cargarLista();
  }

  function checkSesion() {
    const token = localStorage.getItem("tgg_admin_token");
    const email = localStorage.getItem("tgg_admin_email");
    if (token && email) {
      mostrarAdmin(email);
    } else {
      document.getElementById("login-view").style.display = "block";
      document.getElementById("admin-view").style.display = "none";
    }
  }

  async function hacerLogin() {
    const loginError = document.getElementById("login-error");
    const email = document.getElementById("login-email").value.trim();
    const password = document.getElementById("login-pass").value;
    if (!email || !password) {
      loginError.style.color = "#FCA5A5";
      loginError.textContent = "Escribí correo y contraseña.";
      loginError.style.display = "block";
      return;
    }
    loginError.style.color = "#9CA3AF";
    loginError.textContent = "Entrando...";
    loginError.style.display = "block";
    try {
      const res = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=password", {
        method: "POST",
        headers: { "apikey": SUPABASE_ANON_KEY, "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (!res.ok) {
        loginError.style.color = "#FCA5A5";
        loginError.textContent = "No se pudo entrar: " + (data.error_description || data.msg || res.status);
        loginError.style.display = "block";
        return;
      }
      guardarSesion(data.access_token, data.refresh_token, data.user.email);
      mostrarAdmin(data.user.email);
    } catch (e) {
      loginError.style.color = "#FCA5A5";
      loginError.textContent = "Error de red al entrar: " + e.message;
      loginError.style.display = "block";
    }
  }

  async function hacerSignup() {
    const loginError = document.getElementById("login-error");
    const email = document.getElementById("login-email").value.trim();
    const password = document.getElementById("login-pass").value;
    if (!email || !password) {
      loginError.style.color = "#FCA5A5";
      loginError.textContent = "Escribí correo y contraseña arriba, luego click en 'Crear cuenta admin'.";
      loginError.style.display = "block";
      return;
    }
    loginError.style.color = "#9CA3AF";
    loginError.textContent = "Creando cuenta...";
    loginError.style.display = "block";
    try {
      const res = await fetch(SUPABASE_URL + "/auth/v1/signup", {
        method: "POST",
        headers: { "apikey": SUPABASE_ANON_KEY, "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (!res.ok) {
        loginError.style.color = "#FCA5A5";
        loginError.textContent = "Error al crear cuenta: " + (data.msg || data.error_description || res.status);
        loginError.style.display = "block";
        return;
      }
      if (data.access_token) {
        guardarSesion(data.access_token, data.refresh_token, email);
        mostrarAdmin(email);
      } else {
        loginError.style.color = "#86EFAC";
        loginError.textContent = "Cuenta creada. Si pide confirmación revisa tu correo, si no, ya podés entrar con 'Entrar'.";
        loginError.style.display = "block";
      }
    } catch (e) {
      loginError.style.color = "#FCA5A5";
      loginError.textContent = "Error de red al crear cuenta: " + e.message;
      loginError.style.display = "block";
    }
  }

  document.getElementById("btn-login").onclick = function () {
    try { hacerLogin(); } catch (e) { alert("Error en botón Entrar: " + (e && e.message ? e.message : e)); }
  };
  document.getElementById("link-signup").onclick = function (e) {
    e.preventDefault();
    try { hacerSignup(); } catch (err) { alert("Error en botón Crear cuenta: " + (err && err.message ? err.message : err)); }
  };
  document.getElementById("btn-logout").addEventListener("click", () => {
    borrarSesion();
    checkSesion();
  });

  let editandoId = null;

  function resetearFormulario() {
    editandoId = null;
    document.getElementById("form-titulo").textContent = "➕ Agregar negocio";
    document.getElementById("btn-guardar").textContent = "Guardar negocio";
    document.getElementById("link-cancelar-edicion").style.display = "none";
    document.getElementById("f-nombre").value = "";
    document.getElementById("f-categoria").value = "Comida y bebida";
    document.getElementById("f-emoji").value = "";
    document.getElementById("f-zona").value = "";
    document.getElementById("f-precio").value = "2";
    document.getElementById("f-duracion").value = "";
    document.getElementById("f-meta").value = "";
    document.getElementById("f-waze").value = "";
    document.getElementById("f-imagen").value = "";
    document.getElementById("f-imagen").value = "";
    document.getElementById("f-descripcion").value = "";
    document.querySelectorAll(".chk-row input").forEach(c => c.checked = false);
    document.getElementById("f-patrocinado").checked = false;
  }

  function cargarNegocioEnFormulario(n) {
    editandoId = n.id;
    document.getElementById("form-titulo").textContent = "✏️ Editando: " + n.nombre;
    document.getElementById("btn-guardar").textContent = "Actualizar negocio";
    document.getElementById("link-cancelar-edicion").style.display = "inline";
    document.getElementById("f-nombre").value = n.nombre || "";
    document.getElementById("f-categoria").value = n.categoria || "Comida y bebida";
    document.getElementById("f-emoji").value = n.emoji || "";
    document.getElementById("f-zona").value = n.zona ?? "";
    document.getElementById("f-precio").value = n.precio || 2;
    document.getElementById("f-duracion").value = n.duracion || "";
    document.getElementById("f-meta").value = n.meta || "";
    document.getElementById("f-waze").value = n.waze_url || "";
    document.getElementById("f-imagen").value = n.imagen_url || "";
    document.getElementById("f-descripcion").value = n.descripcion || "";
    const companiaSet = new Set(n.compania || []);
    document.querySelectorAll(".chk-row input").forEach(c => c.checked = companiaSet.has(c.value));
    document.getElementById("f-patrocinado").checked = !!n.patrocinado;
    document.querySelector(".card").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  document.getElementById("link-cancelar-edicion").addEventListener("click", (e) => {
    e.preventDefault();
    resetearFormulario();
  });

  document.getElementById("btn-guardar").addEventListener("click", async () => {
    const formError = document.getElementById("form-error");
    const formOk = document.getElementById("form-ok");
    formError.style.display = "none";
    formOk.style.display = "none";

    const categoria = document.getElementById("f-categoria").value;
    const colorMap = { "Diversión": "div", "Cines": "cines", "Deportes": "dep", "Comida y bebida": "comida", "Hotel y Spa": "hotel", "Fiestas": "fiestas", "Conciertos": "conciertos", "Teatro": "teatro" };
    const compania = Array.from(document.querySelectorAll(".chk-row input:checked")).map(c => c.value);

    const nuevo = {
      nombre: document.getElementById("f-nombre").value.trim(),
      categoria,
      color_var: colorMap[categoria],
      emoji: document.getElementById("f-emoji").value.trim() || "📍",
      meta: document.getElementById("f-meta").value.trim(),
      waze_url: document.getElementById("f-waze").value.trim() || null,
      imagen_url: document.getElementById("f-imagen").value.trim() || null,
      descripcion: document.getElementById("f-descripcion").value.trim() || null,
      zona: Number(document.getElementById("f-zona").value) || 0,
      precio: Number(document.getElementById("f-precio").value) || 2,
      duracion: document.getElementById("f-duracion").value.trim() || "2h",
      compania: compania.length ? compania : ["pareja", "amigos", "familia", "solo"],
      patrocinado: document.getElementById("f-patrocinado").checked,
    };

    if (!nuevo.nombre || !nuevo.meta) {
      formError.textContent = "Nombre y texto corto son obligatorios.";
      formError.style.display = "block";
      return;
    }

    try {
      const esEdicion = !!editandoId;
      const url = esEdicion
        ? SUPABASE_URL + "/rest/v1/negocios?id=eq." + editandoId
        : SUPABASE_URL + "/rest/v1/negocios";
      const res = await fetchAutenticado(url, {
        method: esEdicion ? "PATCH" : "POST",
        headers: {
          "apikey": SUPABASE_ANON_KEY,
          "Content-Type": "application/json",
          "Prefer": "return=minimal"
        },
        body: JSON.stringify(nuevo)
      });
      if (!res.ok) {
        const errText = await res.text();
        formError.textContent = "No se pudo guardar: " + errText;
        formError.style.display = "block";
        return;
      }
      formOk.textContent = esEdicion ? "Negocio actualizado ✅" : "Negocio guardado ✅";
      formOk.style.display = "block";
      resetearFormulario();
      cargarLista();
    } catch (e) {
      formError.textContent = "Error de red al guardar: " + e.message;
      formError.style.display = "block";
    }
  });

  async function cargarLista() {
    const cont = document.getElementById("lista-negocios");
    try {
      const res = await fetch(SUPABASE_URL + "/rest/v1/negocios?select=*&order=creado_en.desc", {
        headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": "Bearer " + SUPABASE_ANON_KEY }
      });
      const data = await res.json();
      if (!res.ok) {
        cont.innerHTML = `<div class="sub">Error al cargar: ${JSON.stringify(data)}</div>`;
        return;
      }
      if (!data || data.length === 0) {
        cont.innerHTML = `<div class="sub">Todavía no hay negocios.</div>`;
        return;
      }
      cont.innerHTML = "";
      data.forEach(n => {
        const item = document.createElement("div");
        item.className = "neg-item";
        item.innerHTML = `
          <div>
            <div class="neg-name">${n.emoji} ${n.nombre} ${n.patrocinado ? "⭐" : ""} ${n.waze_url ? "🧭" : ""}</div>
            <div class="neg-cat">${n.categoria} · Zona ${n.zona}</div>
          </div>
          <div class="neg-actions">
            <button class="btn-editar" data-id="${n.id}">Editar</button>
            <button class="btn-danger" data-id="${n.id}">Borrar</button>
          </div>
        `;
        item.querySelector(".btn-editar").addEventListener("click", () => {
          cargarNegocioEnFormulario(n);
        });
        item.querySelector(".btn-danger").addEventListener("click", async () => {
          if (!confirm(`¿Borrar "${n.nombre}"?`)) return;
          await fetchAutenticado(SUPABASE_URL + "/rest/v1/negocios?id=eq." + n.id, {
            method: "DELETE",
            headers: { "apikey": SUPABASE_ANON_KEY }
          });
          cargarLista();
        });
        cont.appendChild(item);
      });
    } catch (e) {
      cont.innerHTML = `<div class="sub">Error de red: ${e.message}</div>`;
    }
  }

  checkSesion();
</script>
<div style="text-align:center; color:#4B5563; font-size:11px; margin-top:8px;">build: v9-detalle-rebrand</div>
</body>
</html>
